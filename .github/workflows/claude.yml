# Claude Code General Workflow
# Executes tasks when @claude is mentioned in issues, pull requests, or comments.
# Provides AI-powered assistance for code modifications, reviews, and repository tasks.
# Responds to custom prompts and instructions specified in the comment that tagged it.
#
# Tool access: claude-code-action's tag mode always grants Read/Glob/Grep, the GitHub
# comment/CI MCP tools, and git add/commit/push under --permission-mode acceptEdits,
# regardless of what's configured below. The claude_args below extend that baseline with
# general Bash, Edit/Write and web access. claude-code-action only runs for users with
# write access to the repository, so outside commenters on this public repo can't trigger it.

name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude fix it')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow editing files and creating commits
      pull-requests: write # Allow commenting and modifying PRs
      issues: write # Allow commenting and modifying issues
      id-token: write # Required for Claude authentication
      actions: read # Allow reading CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --model claude-opus-5-5
            --fallback-model claude-sonnet-5
            --effort high
            --max-turns 60
            --allowedTools "Bash,Edit,Write,WebSearch,WebFetch,Skill"
