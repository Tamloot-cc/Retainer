name: Deploy to AWS

# Applies deploy/aws with Terraform, then ships the current commit with
# deploy/aws/deploy.sh (docs/aws.md, From GitHub Actions). Runs by hand, in
# the GitHub Environment "production", which only main may use; its
# variables and secrets hold Terraform's inputs and where the state lives.
#
# Terraform's output stays in files on the runner. The log shows the plan's
# summary line, and on failure only the error lines.

on:
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: Apply a plan that destroys or replaces resources
        type: boolean
        default: false

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write # AWS credentials through GitHub OIDC
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - name: Check the environment's variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          err=0
          for var in AWS_ROLE_ARN AWS_REGION TF_STATE_BUCKET TF_STATE_KEY; do
            if [ -z "${!var}" ]; then echo "::error::Set $var on the production environment"; err=1; fi
          done
          exit $err
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: deploy/aws/build.sh
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.17.0
          # The wrapper echoes Terraform's output into the log.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: deploy/aws
        env:
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION }}
        run: |
          terraform init -no-color \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        id: plan
        working-directory: deploy/aws
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_name: ${{ vars.RETAINER_NAME }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_github_subject_prefix: ${{ vars.OIDC_SUBJECT_PREFIX }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_domain_certificate_validated: ${{ vars.DOMAIN_CERTIFICATE_VALIDATED }}
          TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_microsoft_client_id: ${{ vars.MICROSOFT_CLIENT_ID }}
          TF_VAR_microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_state_key: ${{ vars.TF_STATE_KEY }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          # Unset environment values arrive empty: leave those to the defaults.
          for var in $(compgen -e | grep '^TF_VAR_'); do
            [ -n "${!var}" ] || unset "$var"
          done

          code=0
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.log 2>&1 || code=$?
          if [ "$code" -eq 1 ]; then
            grep -E '^(│ )?Error: ' plan.log || echo "::error::terraform plan failed"
            exit 1
          fi
          grep -E '^(Plan: |No changes\.)' plan.log || echo "Only output values change."
          [ "$code" -eq 2 ] || exit 0

          terraform show -json tfplan > plan.json
          own="$(jq -r '.resource_changes[]? | select(.address | test("^aws_iam_role(_policy)?\\.github_deploy\\b")) | select(.change.actions != ["no-op"]) | .address' plan.json)"
          if [ -n "$own" ]; then
            echo "::error::The plan changes this workflow's own role, which only an operator can apply: run terraform apply locally first."
            exit 1
          fi
          destroyed="$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address' plan.json)"
          if [ -n "$destroyed" ] && [ "$ALLOW_DESTROY" != true ]; then
            echo "::error::The plan destroys or replaces resources. Run again with allow_destroy to apply it."
            echo "$destroyed"
            exit 1
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        if: steps.plan.outputs.changes == 'true'
        working-directory: deploy/aws
        run: |
          if ! terraform apply -no-color -lock-timeout=5m tfplan > apply.log 2>&1; then
            grep -E '^(│ )?Error: ' apply.log || echo "::error::terraform apply failed"
            exit 1
          fi
          grep -E '^Apply complete!' apply.log

      - run: deploy/aws/deploy.sh --name "${RETAINER_NAME:-retainer}"
        env:
          RETAINER_NAME: ${{ vars.RETAINER_NAME }}
