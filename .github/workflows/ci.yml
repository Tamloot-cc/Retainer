name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks before publishing.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when the release workflow calls this
  # one, so a release never cancels (or is cancelled by) CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retainer
          POSTGRES_PASSWORD: retainer
          POSTGRES_DB: retainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retainer"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://retainer:retainer@localhost:5432/retainer

    steps:
      - uses: actions/checkout@v7
      # Dependabot may bump only the first FROM of a multi-stage Dockerfile.
      - name: Both Dockerfile stages use the same Node image
        run: |
          tags="$(grep -oE '^FROM .*node:[^ ]+' docker/Dockerfile | grep -oE 'node:[^ ]+' | sort -u)"
          [ "$(echo "$tags" | wc -l)" -eq 1 ] ||
            { echo "::error file=docker/Dockerfile::The stages use different Node images: $(echo $tags)"; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @retainer/server exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-browser-traces
          path: packages/server/test-results
          retention-days: 7
