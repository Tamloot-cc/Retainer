name: Docs site

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/cli/src/commands.ts"
      - "packages/sdk/src/index.ts"
      - ".github/workflows/docs.yml"
      - ".nvmrc"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/cli/src/commands.ts"
      - "packages/sdk/src/index.ts"
      - ".github/workflows/docs.yml"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build and verify the static site
        env:
          RETAINER_DOCS_ORIGIN: ${{ vars.RETAINER_DOCS_ORIGIN || 'http://localhost:3000' }}
        run: |
          pnpm build
          pnpm test:export
      - run: pnpm build:server
      - run: pnpm test:mcp
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.RETAINER_DOCS_ORIGIN && 'retainer-docs' || 'retainer-docs-preview' }}
          path: apps/docs/out/
          if-no-files-found: error
