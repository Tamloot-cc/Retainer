<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Retainer</title>
    <style>
      html { background: #fcfcfd; }
      @media (prefers-color-scheme: dark) { html { background: #18191e; } }
    </style>
  </head>
  <body>
    <!-- The splash shows while the scripts load; React replaces it with the
         same mark (Splash in src/ui/index.tsx), turning in step with this one.
         Keep the drawing in step with src/ui/logo-mark.tsx. -->
    <div id="root"><div class="retainer-splash" role="status"><span class="retainer-mark" data-mood="working" role="img" aria-label="Loading Retainer" style="width:40px;height:40px;--mark-cycle:1600ms"><svg viewBox="32 32 736 736" width="100%" height="100%" fill="none" aria-hidden="true"><defs><linearGradient id="retainer-splash-fade" gradientUnits="userSpaceOnUse" x1="700" y1="100" x2="100" y2="700"><stop offset="0" stop-color="#D4FA38" /><stop offset="0.55" stop-color="#1F5E3A" /></linearGradient></defs><mask id="retainer-splash-ring" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="1000"><g class="mark-breathe"><g class="mark-turn"><path d="M 528 128.67731389 A 300 300 0 1 0 665.32998323 260 L 549.74979132 260 A 205 205 0 1 1 528 239.87192626 Z" fill="#fff" /></g></g></mask><rect class="mark-fixed" x="-100" y="-100" width="1000" height="1000" fill="url(#retainer-splash-fade)" mask="url(#retainer-splash-ring)" /><g class="mark-breathe"><g class="mark-turn"><path class="mark-ring" d="M 528 128.67731389 A 300 300 0 1 0 665.32998323 260 L 549.74979132 260 A 205 205 0 1 1 528 239.87192626 Z" /><g class="mark-move"><g class="mark-pop"><rect class="mark-upright mark-square" x="565" y="129" width="96" height="96" /></g></g></g></g></svg></span></div></div>
    <script>
      const splash = document.querySelector('.retainer-splash');
      const cycle = parseFloat(splash.querySelector('.retainer-mark').style.getPropertyValue('--mark-cycle'));
      splash.style.setProperty('--splash-phase', -(performance.now() % cycle) + 'ms');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
